<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>ChatApp - Login</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet"
        />

        <link href="./loginsCss.css" rel="stylesheet" />
    </head>

    <body>
        <main class="auth-page">
            <div class="auth-container">
                <!-- LOGIN -->

                <section class="auth-login">
                    <div class="brand">
                        <div class="brand-icon">
                            <i class="bi bi-chat-dots-fill"></i>
                        </div>

                        <span>ChatApp</span>
                    </div>

                    <h1>Bem-vindo de volta!</h1>

                    <p class="subtitle">
                        Faça login para continuar conversando.
                    </p>

                    <form class="forms" id="loginForm">
                        <label for="email"> E-mail </label>

                        <div class="input-wrapper">
                            <i class="bi bi-envelope"></i>

                            <input
                                name="email"
                                placeholder="seu@email.com"
                                id="email"
                                type="email"
                                required
                            />
                        </div>

                        <label for="senha"> Senha </label>

                        <div class="input-wrapper">
                            <i class="bi bi-lock"></i>

                            <input
                                name="senha"
                                id="senha"
                                placeholder="Sua senha"
                                type="password"
                                required
                            />

                            <button type="button" class="password-toggle">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>

                        

                        <button type="submit" class="auth-button">
                            Entrar
                        </button>
                    </form>

                    <div class="divider">
                        <span></span>

                        <p>ou</p>

                        <span></span>
                    </div>

                    <button
                        type="button"
                        id="googleLogin"
                        class="google-button"
                    >
                        <svg
                            class="google-icon"
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path
                                fill="#4285F4"
                                d="M21.35 12.23c0-.79-.07-1.55-.22-2.28H12v4.32h5.23a4.47 4.47 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.92-4.18 2.92-7.41z"
                            />

                            <path
                                fill="#34A853"
                                d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.93-3.31.93-2.55 0-4.71-1.72-5.49-4.03H3.27v2.52A9.75 9.75 0 0 0 12 21.5z"
                            />

                            <path
                                fill="#FBBC05"
                                d="M6.51 13.6A5.86 5.86 0 0 1 6.2 12c0-.56.1-1.1.31-1.6V7.88H3.27A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.02 4.12l3.24-2.52z"
                            />

                            <path
                                fill="#EA4335"
                                d="M12 6.37c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.46 14.63 2.5 12 2.5a9.75 9.75 0 0 0-8.73 5.38l3.24 2.52C7.29 8.09 9.45 6.37 12 6.37z"
                            />
                        </svg>

                        <span>Entrar com Google</span>
                    </button>

                    <p class="bottom-text">
                        Ainda não tem uma conta?

                        <a href="/register"> Cadastre-se </a>
                    </p>
                </section>

                <!-- CADASTRO -->

                <section class="auth-register">
                    <div class="register-icon">
                        <i class="bi bi-person-plus"></i>
                    </div>

                    <h2>Crie sua conta</h2>

                    <p class="register-subtitle">
                        Preencha os dados para se cadastrar.
                    </p>

                    <form class="forms" id="registroForm">
                        <label> Nome </label>

                        <div class="input-wrapper">
                            <i class="bi bi-person"></i>

                            <input
                                name="nome"
                                placeholder="Seu nome completo"
                                type="text"
                                required
                            />
                        </div>

                        <label> E-mail </label>

                        <div class="input-wrapper">
                            <i class="bi bi-envelope"></i>

                            <input
                                name="email"
                                placeholder="seu@email.com"
                                type="email"
                                required
                            />
                        </div>

                        <label> Senha </label>

                        <div class="input-wrapper">
                            <i class="bi bi-lock"></i>

                            <input
                                name="senha"
                                placeholder="Crie uma senha"
                                type="password"
                                required
                            />

                            <button type="button" class="password-toggle">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>

                        <label> Confirmar senha </label>

                        <div class="input-wrapper">
                            <i class="bi bi-lock"></i>

                            <input
                                name="confirmarSenha"
                                placeholder="Confirme sua senha"
                                type="password"
                                required
                            />

                            <button type="button" class="password-toggle">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>

                        <button
                            type="submit"
                            class="auth-button register-button"
                        >
                            Cadastrar
                        </button>
                    </form>

                    <p class="bottom-text">
                        Já tem uma conta?

                        <a href="/"> Faça login </a>
                    </p>
                </section>
            </div>
        </main>

        <script src="./login.js"></script>
        <script src="./register.js"></script>
    </body>
</html>
